<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>friedict</title>
    <meta
      name="description"
      content="Predicciones privadas entre amigos. Elegí qué va a pasar y descubrí quién tenía razón."
    />

    <!-- Los grupos son privados: nada de esto debe terminar en un buscador. -->
    <meta name="robots" content="noindex, nofollow, noarchive, noimageindex" />
    <meta name="referrer" content="same-origin" />

    <meta name="theme-color" content="#f1f0fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14142a" media="(prefers-color-scheme: dark)" />

    <script>
      // Aplica el tema antes del primer pintado para que no haya flash.
      (function () {
        try {
          var stored = localStorage.getItem('friedict.theme')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.dataset.theme = theme
        } catch (_) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
